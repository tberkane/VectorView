[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorview"
version = "0.1.0"
description = "Text search over street-level imagery: Street View collection, SigLIP-2 image and tile embeddings, LLM query expansion and VLM reranking, with a local web app."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Thomas Berkane" }]
requires-python = ">=3.11"
keywords = ["street view", "image retrieval", "vision-language models", "SigLIP", "pgvector", "public health"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "numpy>=1.26",
    "osmnx>=2.0",
    "pgvector>=0.4",
    "pillow>=10.0",
    "psycopg[binary]>=3.2",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "shapely>=2.1",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Install the torch build for your platform first (https://pytorch.org/get-started/locally/).
encoding = [
    "accelerate>=1.0",
    "sentencepiece>=0.2",
    "torch>=2.4",
    "transformers>=5.8",
]
llm = ["google-genai>=1.0", "openai>=2.1"]
web = ["fastapi>=0.115", "jinja2>=3.1", "python-multipart>=0.0.20", "uvicorn[standard]>=0.32"]
scraper = [
    "aiohttp>=3.9",
    "py360convert>=1.0",
    "streetlevel>=0.10",
    # Optional GPU projection (falls back to py360convert without CUDA).
    "pyequilib>=0.5; sys_platform == 'linux'",
]
test = [
    "vectorview[web]",
    "hypothesis>=6.100",
    "httpx2>=2.0",  # used by starlette's TestClient
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "respx>=0.21",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
dev = ["vectorview[test,docs]", "mypy>=1.11", "ruff>=0.6"]

[project.scripts]
vectorview = "vectorview.cli:main"

[project.urls]
Homepage = "https://github.com/tberkane/VectorView"
Documentation = "https://tberkane.github.io/VectorView/"
Source = "https://github.com/tberkane/VectorView"
Issues = "https://github.com/tberkane/VectorView/issues"
Changelog = "https://github.com/tberkane/VectorView/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vectorview = ["py.typed", "web/templates/*.html", "web/static/*.css"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# The LLM prompts are kept verbatim, so their long lines are not wrapped.
"src/vectorview/web/llm_expand.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["postgres: needs a Postgres server with pgvector (set VECTORVIEW_TEST_PG_DSN)"]

[tool.coverage.run]
branch = true
source = ["vectorview"]
# These need torch, model weights or a CUDA GPU, so CI does not run them.
omit = ["*/vectorview/siglip.py", "*/vectorview/_gpu_project.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
